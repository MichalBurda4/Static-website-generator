[project]
name = "ssg"
version = "0.1.0"
description = "Simple static site generator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Jinja2>=3.1",
    "markdown>=3.11",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
ssg = "ssg.cli:main"

[tool.uv]
package= true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"  # or "strict"
venvPath = "."
venv = ".venv"
