{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ site.site_name }}{% endblock %}

{% block content %}
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <time datetime="{{ page.date.isoformat() }}">{{ page.date.isoformat() }}</time>
    {% endif %}
  </header>

  <div class="post-body">
    {{ page.html | safe }}
  </div>

  <p class="back-link"><a href="{{ home_url }}">← Back to posts</a></p>
</article>
{% endblock %}
