<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.site_name }}{% endblock %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ static_url }}css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ home_url }}">{{ site.site_name }}</a>
      <p class="site-tagline">{{ site.description }}</p>
      {% if pages %}
      <nav class="site-nav" aria-label="Pages">
        {% for page in pages %}
        <a href="{{ root_prefix }}{{ page.url }}">{{ page.title }}</a>
        {% endfor %}
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.author }}</p>
    </div>
  </footer>
</body>
</html>
